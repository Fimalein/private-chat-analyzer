name: Privacy egress audit (synthetic Chromium)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-egress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser:
    name: Audit import and review network boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce public fixture safety
        run: npm run privacy:guard
      - name: Install app and build static output
        run: |
          npm ci
          npm run build
      - name: Install isolated Chromium audit dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit the actual browser import / review / preflight
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/chatstory-static-server.log 2>&1 &
          node scripts/audit-browser-network.cjs
      - name: Verify production dependency gate
        run: npm audit --omit=dev --audit-level=high
