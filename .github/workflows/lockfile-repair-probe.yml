name: Lockfile repair probe (temporary)
on:
  push:
    branches:
      - feat/strict-chatgpt-sharing-preflight
    paths:
      - .github/workflows/lockfile-repair-probe.yml
permissions:
  contents: read
jobs:
  lockfile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched production dependency without committing
        shell: bash
        run: |
          cp package-lock.json /tmp/before-package-lock.json
          npm install next@16.4.3 eslint-config-next@16.4.3 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/before-package-lock.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changed = Object.entries(after.packages).filter(([path, value]) =>
            JSON.stringify(before.packages[path]) !== JSON.stringify(value));
          const removed = Object.keys(before.packages).filter(path => !(path in after.packages));
          const payload = { packageJson: JSON.parse(fs.readFileSync('package.json', 'utf8')), changed, removed };
          console.log('LOCK_PATCH_BEGIN:' + Buffer.from(JSON.stringify(payload)).toString('base64') + ':LOCK_PATCH_END');
          console.log('Number of lockfile entries changed:', changed.length, 'removed:', removed.length);
          NODE
      - name: Check production audit on proposed lockfile
        run: npm audit --omit=dev --audit-level=high
