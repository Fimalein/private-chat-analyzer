name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Public-repository privacy guard
        run: npm run privacy:guard

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational baseline)
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
