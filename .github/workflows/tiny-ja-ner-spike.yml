name: Tiny Japanese NER spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/spike-tiny-ja-ner.py"
      - "tests/fixtures/synthetic/doccloak-ja-benchmark.json"
      - "docs/privacy/japanese-local-ner-candidates.md"
      - ".github/workflows/tiny-ja-ner-spike.yml"

permissions:
  contents: read

jobs:
  synthetic-ner-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "onnx>=1.16,<2" "onnxruntime>=1.18,<2" sentencepiece fugashi

      - name: Train, export, quantize, and benchmark
        run: python scripts/spike-tiny-ja-ner.py

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: tiny-ja-ner-results
          path: benchmark-output/tiny-ja-ner/results.json
          if-no-files-found: error
          retention-days: 7
