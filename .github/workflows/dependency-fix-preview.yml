name: Dependency fix preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  preview:
    name: Preview dependency remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/audit-triage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Upgrade aligned Next packages
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0
      - name: Apply non-breaking transitive audit fixes
        run: npm audit fix || true
      - name: Production audit must be clean
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified manifest changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): update audited dependencies"
          git push origin HEAD:security/audit-triage
