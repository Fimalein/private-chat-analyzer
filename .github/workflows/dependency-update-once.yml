name: One-time dependency update

on:
  push:
    branches:
      - security/npm-audit-triage

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-triage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade patched Next.js line
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0
      - run: npm test
      - run: npm run build
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "security(deps): upgrade Next.js to 16.4.0 [skip ci]"
          git push origin HEAD:security/npm-audit-triage
